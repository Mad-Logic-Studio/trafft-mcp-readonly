name: Bootstrap Trafft credentials into Supabase Vault

on:
  push:
    branches: ["ops/supabase-trafft-bootstrap"]
    paths: [".github/workflows/bootstrap-supabase-trafft.yml"]

permissions:
  contents: read

jobs:
  bootstrap:
    environment: trafft-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TRAFFT_API_URL: ${{ secrets.TRAFFT_API_URL }}
      TRAFFT_ALLOWED_HOSTS: ${{ secrets.TRAFFT_ALLOWED_HOSTS }}
      TRAFFT_CLIENT_ID: ${{ secrets.TRAFFT_CLIENT_ID }}
      TRAFFT_CLIENT_SECRET: ${{ secrets.TRAFFT_CLIENT_SECRET }}
    steps:
      - name: Validate required protected values exist
        shell: bash
        run: |
          set -euo pipefail
          for name in TRAFFT_API_URL TRAFFT_ALLOWED_HOSTS TRAFFT_CLIENT_ID TRAFFT_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Required protected value $name is unavailable." >&2
              exit 1
            fi
          done

      - name: Transfer credentials server-to-server
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg api_url "$TRAFFT_API_URL" \
            --arg allowed_hosts "$TRAFFT_ALLOWED_HOSTS" \
            --arg client_id "$TRAFFT_CLIENT_ID" \
            --arg client_secret "$TRAFFT_CLIENT_SECRET" \
            '{api_url:$api_url,allowed_hosts:$allowed_hosts,client_id:$client_id,client_secret:$client_secret}')"

          response_file="$RUNNER_TEMP/trafft-bootstrap-response.json"
          status="$(curl --silent --show-error \
            --max-time 45 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data-binary "$payload" \
            'https://eynudwavdlpjrcumsnrg.supabase.co/functions/v1/trafft-bootstrap-b04360aca0f87636')"

          if [ "$status" != "201" ] && [ "$status" != "410" ]; then
            echo "Supabase bootstrap failed with HTTP $status." >&2
            cat "$response_file" >&2 || true
            exit 1
          fi

          echo "Supabase Trafft credential bootstrap returned HTTP $status."
