name: Controlled Trafft read-only validation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type READ_ONLY_ONLY to confirm no writes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trafft-readonly-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.inputs.confirmation == 'READ_ONLY_ONLY'
    environment: trafft-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 1976b341ee6a535863d29a616270b89a408a2d71
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm

      - name: Install reviewed dependencies
        run: npm ci --ignore-scripts

      - name: Re-run non-live gates
        run: npm run check

      - name: Check live configuration without exposing values
        env:
          TRAFFT_API_URL: ${{ secrets.TRAFFT_API_URL }}
          TRAFFT_API_PATH: /api/v2
          TRAFFT_AUTH_PATH: /token
          TRAFFT_ALLOWED_HOSTS: ${{ secrets.TRAFFT_ALLOWED_HOSTS }}
          TRAFFT_CLIENT_ID: ${{ secrets.TRAFFT_CLIENT_ID }}
          TRAFFT_CLIENT_SECRET: ${{ secrets.TRAFFT_CLIENT_SECRET }}
          TRAFFT_ENABLE_EXPERIMENTAL_READS: "false"
          TRAFFT_LIVE_VALIDATION_ACK: READ_ONLY_ONLY
        run: npm run validate:preflight

      - name: Diagnose one live read response without exposing payload
        env:
          TRAFFT_API_URL: ${{ secrets.TRAFFT_API_URL }}
          TRAFFT_API_PATH: /api/v2
          TRAFFT_AUTH_PATH: /token
          TRAFFT_ALLOWED_HOSTS: ${{ secrets.TRAFFT_ALLOWED_HOSTS }}
          TRAFFT_CLIENT_ID: ${{ secrets.TRAFFT_CLIENT_ID }}
          TRAFFT_CLIENT_SECRET: ${{ secrets.TRAFFT_CLIENT_SECRET }}
          TRAFFT_AUDIT_LOG_PATH: ${{ runner.temp }}/trafft-diagnostic-audit.jsonl
          TRAFFT_ENABLE_EXPERIMENTAL_READS: "false"
          TRAFFT_LIVE_VALIDATION_ACK: READ_ONLY_ONLY
          TRAFFT_TIMEOUT_MS: "30000"
          TRAFFT_MAX_HTTP_BODY_BYTES: "5000000"
          TRAFFT_MAX_RESPONSE_CHARS: "20000"
          TRAFFT_MAX_RETRIES: "0"
        run: npm run validate:diagnostic

      - name: Verify diagnostic audit remained metadata-only
        if: always()
        env:
          TRAFFT_AUDIT_LOG_PATH: ${{ runner.temp }}/trafft-diagnostic-audit.jsonl
          TRAFFT_AUDIT_MIN_GET_EVENTS: "1"
          TRAFFT_CLIENT_ID: ${{ secrets.TRAFFT_CLIENT_ID }}
          TRAFFT_CLIENT_SECRET: ${{ secrets.TRAFFT_CLIENT_SECRET }}
        shell: bash
        run: |
          if [ -s "$TRAFFT_AUDIT_LOG_PATH" ]; then
            npm run validate:audit
          else
            echo "No diagnostic audit events were recorded; the workflow stopped before a Trafft request."
          fi

      - name: Run controlled live read-only validation
        env:
          TRAFFT_API_URL: ${{ secrets.TRAFFT_API_URL }}
          TRAFFT_API_PATH: /api/v2
          TRAFFT_AUTH_PATH: /token
          TRAFFT_ALLOWED_HOSTS: ${{ secrets.TRAFFT_ALLOWED_HOSTS }}
          TRAFFT_CLIENT_ID: ${{ secrets.TRAFFT_CLIENT_ID }}
          TRAFFT_CLIENT_SECRET: ${{ secrets.TRAFFT_CLIENT_SECRET }}
          TRAFFT_EXPECTED_SERVICES_JSON: ${{ secrets.TRAFFT_EXPECTED_SERVICES_JSON }}
          TRAFFT_AUDIT_LOG_PATH: ${{ runner.temp }}/trafft-readonly-audit.jsonl
          TRAFFT_ENABLE_EXPERIMENTAL_READS: "false"
          TRAFFT_LIVE_VALIDATION_ACK: READ_ONLY_ONLY
          TRAFFT_TIMEOUT_MS: "30000"
          TRAFFT_MAX_HTTP_BODY_BYTES: "5000000"
          TRAFFT_MAX_RESPONSE_CHARS: "20000"
          TRAFFT_MAX_RETRIES: "1"
        run: npm run validate:live

      - name: Verify full audit remained metadata-only
        if: always()
        env:
          TRAFFT_AUDIT_LOG_PATH: ${{ runner.temp }}/trafft-readonly-audit.jsonl
          TRAFFT_AUDIT_MIN_GET_EVENTS: "6"
          TRAFFT_CLIENT_ID: ${{ secrets.TRAFFT_CLIENT_ID }}
          TRAFFT_CLIENT_SECRET: ${{ secrets.TRAFFT_CLIENT_SECRET }}
        shell: bash
        run: |
          if [ -s "$TRAFFT_AUDIT_LOG_PATH" ]; then
            npm run validate:audit
          else
            echo "No full-validation audit events were recorded; the workflow stopped before the full Trafft validation."
          fi
