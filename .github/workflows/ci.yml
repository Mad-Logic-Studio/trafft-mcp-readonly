name: CI
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
          cache: npm
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
      - name: Inspect published Trafft read parameter contracts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const source = "https://documenter.gw.postman.com/api/collections/1487056/2sAY4x9MRe?segregateAuth=true&versionTag=latest";
          const response = await fetch(source, {
            redirect: "error",
            headers: { accept: "application/json", "user-agent": "Mad-Logic-Studio-contract-review/1.0" }
          });
          if (!response.ok) throw new Error(`Published collection fetch failed (${response.status}).`);
          const document = await response.json();
          const matches = [];
          function collectEvidence(value, path = "request", output = []) {
            if (value === null || value === undefined) return output;
            if (typeof value === "string") {
              if (value.length <= 500 && /api\/v2|appointment|available|service|employee|location|date|time|page|limit|start|end|timezone|_id/i.test(`${path} ${value}`)) {
                output.push({ path, value });
              }
              return output;
            }
            if (Array.isArray(value)) {
              value.forEach((entry, index) => collectEvidence(entry, `${path}[${index}]`, output));
              return output;
            }
            if (typeof value === "object") {
              for (const [key, entry] of Object.entries(value)) collectEvidence(entry, `${path}.${key}`, output);
            }
            return output;
          }
          function walk(node) {
            if (!node || typeof node !== "object") return;
            if (Array.isArray(node)) {
              for (const value of node) walk(value);
              return;
            }
            const request = node.request;
            const name = String(node.name ?? "");
            if (request && typeof request === "object" && /^(List Appointments|Available times)$/i.test(name)) {
              matches.push({
                name,
                requestKeys: Object.keys(request).sort(),
                urlType: typeof request.url,
                evidence: collectEvidence(request)
              });
            }
            for (const value of Object.values(node)) walk(value);
          }
          walk(document);
          if (matches.length !== 2) throw new Error(`Expected two read requests; found ${matches.length}.`);
          console.log(JSON.stringify(matches, null, 2));
          NODE